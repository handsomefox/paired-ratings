#:schema https://json.schemastore.org/any.json

root = ".."
testdata_dir = "testdata"

[build]
cmd = "go run ./backend"
delay = 1000
include_dir = ["backend"]
include_ext = ["go", "html", "css", "env", "tpl", "tmpl"]
exclude_dir = [
    "backend/web/dist",
]
exclude_regex = ["_test.go", ".pb.go"]
log = "build-errors.log"
rerun_delay = 500

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[screen]
clear_on_rebuild = true
keep_scroll = true
