#:schema https://json.schemastore.org/any.json

# `make watch-backend` runs this from the repository root.
root = ".."
tmp_dir = "tmp"

[build]
# Air restarts bin after each build. `go run` would never exit, so a change
# would never restart the server.
cmd = "go build -o ./tmp/server ./backend"
bin = "./tmp/server"
delay = 1000
include_dir = ["backend"]
# .sql covers the embedded migrations and the sqlc queries.
include_ext = ["go", "sql"]
exclude_dir = ["backend/web/dist"]
exclude_regex = ["_test\\.go$"]
log = "build-errors.log"
rerun_delay = 500

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[screen]
clear_on_rebuild = true
keep_scroll = true
