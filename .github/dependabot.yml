version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The pinned Go tools. A protoc-gen-go or sqlc update needs `make generate`.
  - package-ecosystem: gomod
    directories:
      - /tools
      - /tools/buf
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
