name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Go tools run at the versions pinned in tools/go.mod and tools/buf/go.mod.
env:
  GO_TOOL: go tool -modfile=tools/go.mod

defaults:
  run:
    shell: bash

jobs:
  # backend/web/web.go embeds backend/web/dist, which is not committed, so this
  # job runs first and every Go job downloads its build output.
  frontend:
    name: Frontend
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Trace runner tools
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Check formatting
        run: npm run format:check
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Upload the embedded assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: backend/web/dist
          if-no-files-found: error

  backend:
    name: Backend
    needs: frontend
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Download the embedded assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: backend/web/dist
      - name: Trace runner tools
        run: |
          go version
          git --version
      - name: Check that mise.toml matches go.mod and frontend/.nvmrc
        run: |
          mise_go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)
          mise_node=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          mod_go=$(awk '/^go /{print $2}' go.mod)
          nvmrc_node=$(tr -d '[:space:]' < frontend/.nvmrc)
          test "$mise_go" = "$mod_go" || {
            echo "mise.toml go $mise_go != go.mod $mod_go"; exit 1;
          }
          test "$mise_node" = "$nvmrc_node" || {
            echo "mise.toml node $mise_node != .nvmrc $nvmrc_node"; exit 1;
          }
      - name: Check formatting
        run: test -z "$($GO_TOOL gofumpt -l ./backend)" || { $GO_TOOL gofumpt -d ./backend; exit 1; }
      - name: Verify module tidiness
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
          (cd tools/buf && go mod tidy -diff)
      - name: Lint
        run: $GO_TOOL golangci-lint run ./backend/...
      - name: Test with the race detector
        run: go test -race ./backend/...
      - name: Build
        run: go build -o ./bin/server ./backend

  audit:
    name: Audit
    needs: frontend
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download the embedded assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: backend/web/dist
      - name: Audit the Go modules
        run: $GO_TOOL govulncheck ./backend/...
      - name: Audit the committed npm lockfile
        run: npm audit --audit-level=moderate
        working-directory: frontend

  # Generated code and applied migrations are easy to break without a failing
  # test, so this job checks both against the committed tree.
  generated:
    name: Generated code and migrations
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/buf/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Check that the generated code matches its sources
        run: |
          make generate
          git add --intent-to-add --all backend/gen frontend/src/gen
          git diff --exit-code -- backend/gen frontend/src/gen || {
            echo "Run make generate and commit the result."; exit 1;
          }
      - name: Check that applied migrations are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The 001_schema baseline replaced every earlier migration. A base
          # from before it has nothing to compare against.
          if ! git cat-file -e "$BASE:backend/store/migrations/001_schema.sql" 2>/dev/null; then
            echo "Base $BASE predates the migration baseline; skipping."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- backend/store/migrations)
          if [ -n "$changed" ]; then
            echo "Applied migrations must not change. Add a new numbered file instead:"
            echo "$changed"
            exit 1
          fi
