name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  GOFUMPT_VERSION: v0.11.0
  GOVULNCHECK_VERSION: v1.7.0

defaults:
  run:
    shell: bash

jobs:
  # backend/web/web.go embeds backend/web/dist, which is not committed, so this
  # job runs first and every Go job downloads its build output.
  frontend:
    name: Frontend
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Trace runner tools
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Check formatting
        run: npm run format:check
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Upload the embedded assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: backend/web/dist
          if-no-files-found: error

  backend:
    name: Backend
    needs: frontend
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download the embedded assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: backend/web/dist
      - name: Trace runner tools
        run: |
          go version
          git --version
      - name: Check that mise.toml matches go.mod and frontend/.nvmrc
        run: |
          mise_go=$(sed -n 's/^go = "\(.*\)"$/\1/p' mise.toml)
          mise_node=$(sed -n 's/^node = "\(.*\)"$/\1/p' mise.toml)
          mod_go=$(awk '/^go /{print $2}' go.mod)
          nvmrc_node=$(tr -d '[:space:]' < frontend/.nvmrc)
          test "$mise_go" = "$mod_go" || {
            echo "mise.toml go $mise_go != go.mod $mod_go"; exit 1;
          }
          test "$mise_node" = "$nvmrc_node" || {
            echo "mise.toml node $mise_node != .nvmrc $nvmrc_node"; exit 1;
          }
      - name: Check formatting
        run: |
          go install mvdan.cc/gofumpt@"$GOFUMPT_VERSION"
          test -z "$(gofumpt -l ./backend)" || { gofumpt -d ./backend; exit 1; }
      - name: Verify module tidiness
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./backend/...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          golangci-lint run ./backend/...
      - name: Test with the race detector
        run: go test -race ./backend/...
      - name: Build
        run: go build -o ./bin/server ./backend

  audit:
    name: Audit
    needs: frontend
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download the embedded assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: backend/web/dist
      - name: Audit the Go modules
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"
          govulncheck ./backend/...
      - name: Audit the committed npm lockfile
        run: npm audit --audit-level=moderate
        working-directory: frontend
