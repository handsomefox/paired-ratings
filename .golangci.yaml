version: "2"

output:
  show-stats: true

formatters:
  # The same formatter `make fmt` runs.
  enable:
    - gofumpt

linters:
  default: none
  enable:
    # The golangci-lint defaults.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    - asasalint
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - exptostd
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - goprintffuncname
    - gosec
    - gosmopolitan
    - iface
    - importas
    - inamedparam
    - loggercheck
    - makezero
    - mirror
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign

  settings:
    staticcheck:
      checks:
        - all
        # Spelling out a field of an embedded struct can make the code clearer.
        - -QF1008

    revive:
      # Listing a rule replaces revive's defaults, so keep them explicitly.
      enable-default-rules: true
      rules:
        # Package comments live on one file per package, not on every file.
        - name: package-comments
          disabled: true
        # A doc comment on every exported name would mostly restate the name.
        - name: exported
          disabled: true

    errcheck:
      # Also report errors discarded with `_ =` and unchecked type assertions.
      check-blank: true
      check-type-assertions: true

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags: [diagnostic, style, performance, opinionated]

    sloglint:
      attr-only: true
      args-on-sep-lines: true

issues:
  # Report every finding instead of the first few per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
