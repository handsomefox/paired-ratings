# Railpack, the builder Railway uses, reads this file to pick toolchains.
# The repository root looks like a Go project because go.mod sits here, so
# without this file the build image has no pnpm and `make build` fails at
# `pnpm install` with "pnpm: not found".
#
# Keep node in step with frontend/.nvmrc, pnpm with packageManager in
# frontend/package.json, and go with go.mod. The CI workflow fails when they
# drift.
[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "12.17.0"
